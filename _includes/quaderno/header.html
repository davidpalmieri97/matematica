{%- comment -%} Testata dello stile "quaderno" {%- endcomment -%}
<header class="q-testata">
  <div class="q-testata__dentro contenitore">
    <a class="q-marchio" href="{{ '/' | relative_url }}">
      <span class="q-marchio__segno" aria-hidden="true">
        {%- for area in site.data.aree limit: 4 %}<span class="tema-{{ area.colore }}"></span>{% endfor -%}
      </span>
      <span class="q-marchio__nome">Home</span>
    </a>

    {%- comment -%} Menu in alto: visibile solo su schermi grandi (PC, LIM) {%- endcomment -%}
    <nav class="q-menu" aria-label="Menu principale">
      {% include voci-menu.html classe="q-menu__voce" %}
    </nav>
  </div>
</header>
